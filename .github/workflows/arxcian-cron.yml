# Ajastetut haut arxcianille.
#
# Vercelin Hobby-taso sallii vain kaksi cronia ja nekin kerran päivässä,
# joten ajastus hoidetaan täältä. Työ vain kutsuu sovelluksen cron-reittiä,
# joka päättää mitä haetaan — työt lisätään koodissa JOBS-rekisteriin.
#
# Osoite on rjmob-portal.vercel.app eikä arxcian.vercel.app: repo nimettiin
# uudelleen, Vercel-projektia ei. Se on nykyinen tuotanto-osoite eikä jäänne
# — älä "korjaa" sitä. Ks. CLAUDE.md, "Nimet".
#
# GitHubin ajastus on UTC:ssä eikä tunne kesäaikaa, joten yksi UTC-aika ei
# osu Suomen kelloon ympäri vuoden: talvella (UTC+2) ajo tulee tuntia
# aiemmin kuin kesällä (UTC+3). Siksi jokaiselle hakuajalle on kaksi
# ajastusta, ja alla oleva vartio pysäyttää sen joka on väärässä
# vuodenajassa. Hakuja ajetaan siis neljä vuorokaudessa ympäri vuoden.

name: arxcian cron

on:
  schedule:
    - cron: '0 5 * * *'   # 08:00 kesäaikaa (talvella 07:00 → ohitetaan)
    - cron: '0 6 * * *'   # 08:00 talviaikaa (kesällä 09:00 → ohitetaan)
    - cron: '0 9 * * *'   # 12:00 kesäaikaa
    - cron: '0 10 * * *'  # 12:00 talviaikaa
    - cron: '0 13 * * *'  # 16:00 kesäaikaa
    - cron: '0 14 * * *'  # 16:00 talviaikaa
    - cron: '0 17 * * *'  # 20:00 kesäaikaa
    - cron: '0 18 * * *'  # 20:00 talviaikaa
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Tarkistetaan vain tunti, ei minuutteja: GitHubin ajastus myöhästyy
      # ruuhka-aikoina säännöllisesti kymmeniä minuutteja, ja minuuttiraja
      # hylkäisi silloin koko haun. Väärän vuodenajan ajastus osuu aina
      # tuntiin 7 tai 9 (vastaavasti 11/13, 15/17, 19/21), joka ei ole
      # hakuaika, joten pelkkä tunti riittää erottamaan ne toisistaan.
      - name: Tarkista että Suomessa on hakuaika
        id: vartio
        env:
          TAPAHTUMA: ${{ github.event_name }}
        run: |
          if [ "$TAPAHTUMA" = 'workflow_dispatch' ]; then
            echo "Käsin käynnistetty — ajetaan kellonajasta riippumatta."
            echo 'aja=kylla' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tunti=$(TZ=Europe/Helsinki date +%H)
          case "$tunti" in
            08|12|16|20)
              echo "Suomessa on klo $tunti — hakuaika, ajetaan."
              echo 'aja=kylla' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Suomessa on klo $tunti — ei hakuaika, tämä ajastus kuuluu toiselle vuodenajalle."
              echo 'aja=ei' >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Winpos-tuonti ajetaan yksin ja ennen joukkoajoa. Kaksi syytä: cron
      # ajaa työt rinnakkain, ja tuonti tyhjentää Kassamyynti-alueen ennen
      # kirjoitusta — samaan aikaan lukeva rjmob-summary välimuistittaisi
      # nollat. Ennen joukkoajoa siksi, että saman ajon yhteenvedot näkevät
      # jo tuodut kassaluvut eivätkä edellisen kierroksen lukuja.
      #
      # Tämä vaihe ei kaada workflow'ta: jos Winpos-raportti on viallinen tai
      # Drive on nurin, uutishaut on silti syytä ajaa. Virhe näkyy lokissa ja
      # varoituksena.
      - name: Tuo Winpos-raportit
        if: steps.vartio.outputs.aja == 'kylla'
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS --max-time 200 -w '\n%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            'https://rjmob-portal.vercel.app/api/arxcian/cron?job=winpos-import')

          body=$(printf '%s' "$response" | sed '$d')
          status=$(printf '%s' "$response" | tail -n1)

          echo "$body"

          if [ "$status" != "200" ] || printf '%s' "$body" | grep -q '"ok":false'; then
            echo "::warning::Winpos-tuonti epäonnistui — jatketaan muihin hakuihin"
          fi

      - name: Käynnistä ajastetut haut
        if: steps.vartio.outputs.aja == 'kylla'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS --max-time 290 -w '\n%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://rjmob-portal.vercel.app/api/arxcian/cron)

          body=$(printf '%s' "$response" | sed '$d')
          status=$(printf '%s' "$response" | tail -n1)

          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::Cron-reitti vastasi statuksella $status"
            exit 1
          fi

          # Vanhentunut data ei kaada ajoa. Kun ulkoinen lähde ei vastaa,
          # cron-reitti raportoi työn stale-listalla ja hardFailed pysyy
          # nollassa: sivu näyttää vanhaa dataa, mikä on tarkoitettu käytös.
          # YouTube estää Vercelin konesali-IP:n suunnilleen päivittäin, joten
          # tämän kaataminen tekisi punaisesta ajosta taustakohinaa. Oikeat
          # virheet kaatavat edelleen.
          if printf '%s' "$body" | grep -q '"hardFailed":0'; then
            if printf '%s' "$body" | grep -q '"ok":false'; then
              echo "::warning::Osa lähteistä palautti vanhentunutta dataa — ks. stale-lista"
            fi
          else
            echo "::error::Osa töistä epäonnistui"
            exit 1
          fi
